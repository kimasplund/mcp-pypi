[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-pypi"
dynamic = ["version"]
description = "AI-powered Python package intelligence - search, analyze, and understand PyPI packages through MCP"
readme = "README.md"
authors = [{ name = "Kim Asplund", email = "kim.asplund@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
    "Environment :: Console",
    "Natural Language :: English",
    "Typing :: Typed",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "pypi",
    "python-packages",
    "package-search",
    "dependency-analysis",
    "ai-assistant",
    "claude",
    "llm-tools",
    "package-management",
    "version-tracking",
    "security-scanning",
]
dependencies = [
    "fastmcp>=4.1,<5",
    "aiohttp>=3.12",
    "packaging>=24.0",
    "typer>=0.15",
    "rich>=13.0",
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/kimasplund/mcp-pypi"
"Bug Tracker" = "https://github.com/kimasplund/mcp-pypi/issues"
Documentation = "https://github.com/kimasplund/mcp-pypi#readme"
"Source Code" = "https://github.com/kimasplund/mcp-pypi"
Changelog = "https://github.com/kimasplund/mcp-pypi/releases"

[project.scripts]
mcp-pypi = "mcp_pypi.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pyrefly>=1.3",
]

[tool.hatch.version]
path = "mcp_pypi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mcp_pypi"]

[tool.hatch.build.targets.sdist]
include = ["mcp_pypi", "README.md", "CHANGELOG.md", "LICENSE*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Temporary: mcp_pypi/server is rewritten in Tasks 5-9; Task 9 removes this exclude.
extend-exclude = ["mcp_pypi/server"]

[tool.ruff.format]
# Keep ruff from reformatting code blocks inside markdown docs.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.pyrefly]
project-includes = ["mcp_pypi"]
project-excludes = ["tests", "build", "dist", "*.egg-info"]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = ["integration: needs network; run with -m integration"]
